<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Time Entry</title>
  <link rel="stylesheet" href="../shared/style.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <strong id="user">Time Entry</strong>
    <span>
      <button id="sync" class="icon" title="Sync with Excel" aria-label="Sync with Excel">⟳</button>
      <button id="settings" class="icon" title="Settings" aria-label="Settings">⚙</button>
    </span>
  </header>

  <div id="setup" hidden>
    <p id="setup-text"></p>
    <button id="open-options" class="action next">Open settings</button>
  </div>

  <main id="buttons"></main>
  <button id="show-all" class="link" hidden>Show all</button>

  <p id="status" class="muted"></p>

  <details id="history-box">
    <summary>History</summary>
    <ol id="history"></ol>
  </details>

  <script src="../shared/actions.js"></script>
  <script src="popup.js"></script>
</body>
</html>
